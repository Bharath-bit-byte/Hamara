apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hamarashops-backend
  labels:
    cloud.googleapis.com/location: <REGION>
    app.kubernetes.io/name: hamarashops-backend
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: <REGION>-docker.pkg.dev/<PROJECT_ID>/<IMAGE_REPOSITORY>/hamarashops-backend:<IMAGE_TAG>
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "cloud"
            - name: RESEND_API_KEY
              value: "<RESEND_API_KEY_OR_SECRET_MANAGER_REF>"
            - name: NOTIFICATION_TO_EMAIL
              value: "info@hamarashops.ai"
            - name: CONTACT_FROM_EMAIL
              value: "onboarding@resend.dev"
            - name: FRONTEND_URL
              value: "https://hamarashops.com"

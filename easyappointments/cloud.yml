apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: easyappointments
  labels:
    cloud.googleapis.com/location: <REGION>
    app.kubernetes.io/name: easyappointments
spec:
  template:
    metadata:
      annotations:
        # Connect Cloud Run container to Cloud SQL for MySQL instance
        run.googleapis.com/cloudsql-instances: <PROJECT_ID>:<REGION>:<CLOUDSQL_INSTANCE_NAME>
        # Scale settings for business booking availability
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: <REGION>-docker.pkg.dev/<PROJECT_ID>/<IMAGE_REPOSITORY>/easyappointments:<IMAGE_TAG>
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            # Application Base URL (e.g., https://booking.yourdomain.com or Cloud Run default URL)
            - name: BASE_URL
              value: "https://<BOOKING_SUBDOMAIN_OR_CLOUD_RUN_URL>"

            # MySQL Database Connection (via Cloud SQL Unix socket)
            - name: DB_HOST
              value: "localhost:/cloudsql/<PROJECT_ID>:<REGION>:<CLOUDSQL_INSTANCE_NAME>"
            - name: DB_NAME
              value: "easyappointments"
            - name: DB_USERNAME
              value: "ea_user"

            # Sensitive MySQL password mounted from Google Secret Manager
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: easyappointments-db-password
                  key: latest

            # Application Locale & Reverse Proxy Settings
            - name: LANGUAGE
              value: "english"
            - name: DEBUG_MODE
              value: "FALSE"
            - name: PROXY_IPS
              value: "*"

            # Resend SMTP Email Notification Integration
            - name: MAIL_PROTOCOL
              value: "smtp"
            - name: MAIL_SMTP_HOST
              value: "smtp.resend.com"
            - name: MAIL_SMTP_PORT
              value: "587"
            - name: MAIL_SMTP_USER
              value: "resend"
            - name: MAIL_SMTP_CRYPTO
              value: "tls"
            - name: MAIL_SMTP_AUTH
              value: "1"
            - name: MAIL_FROM_ADDRESS
              value: "onboarding@resend.dev"
            - name: MAIL_FROM_NAME
              value: "HamaraShops.ai Business Consultations"
            - name: MAIL_REPLY_TO_ADDRESS
              value: "info@hamarashops.ai"

            # Resend API Key as SMTP Password mounted from Google Secret Manager
            - name: MAIL_SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: resend-api-key
                  key: latest
